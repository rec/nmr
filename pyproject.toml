[project]
name = "nmr"
version = "0.11.0"
description = "🌐 Name all canonical things 🌐"
authors = [{ name = "Tom Ritchford", email = "tom@swirly.com" }]
requires-python = ">=3.10"
readme = "README.md"
license = "MIT"
classifiers = ["Programming Language :: Python :: 3", "Programming Language :: Python :: 3.10", "Programming Language :: Python :: 3.11", "Programming Language :: Python :: 3.12", "Programming Language :: Python :: 3.13", "Programming Language :: Python :: 3.14", "Programming Language :: Python :: 3.15"]
dependencies = [
    "chess>=1.9.3,<2",
    "semver>=3.0.2,<4",
    "tyro>=1.0,<2",
    "pydantic>=2.10,<3",
]

[project.scripts]
nmr = "nmr._main:main"

[tool.doks]
auto = true

[tool.ruff]
[dependency-groups]
dev = [
    "coverage>=6.5.0,<7",
    "pytest>=7.2.0,<8",
    "ruff>=0.8.2,<0.9",
    "pyupgrade>=3.21.2",
    "ty>=0.0.14",
]

[tool.coverage.run]
branch = true
source = ["nmr"]

[tool.coverage.report]
fail_under = "100"
skip_covered = true
exclude_lines = ["pragma: no cover", "if False:", "if __name__ == .__main__.:", "raise NotImplementedError"]


[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["nmr"]
