<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="referrer" content="no-referrer" />
    <meta name="description" content="Type a detail. Find its truename. Hear it." />
    <title>nmr</title>
    <link rel="stylesheet" href="style.css" />
    <script type="module" src="app.js"></script>
  </head>
  <body>
    <main>
      <h1>nmr</h1>
      <label class="visually-hidden" for="value">A detail or truename</label>
      <input id="value" type="text" autocomplete="off" autocapitalize="off"
        spellcheck="false" autofocus />
      <button id="truename" class="truename" type="button" hidden aria-label="Play or stop the prefix-relative tune" aria-pressed="false"></button>
      <button id="full-truename" class="truename" type="button" hidden aria-label="Play or stop the full-truename tune" aria-pressed="false"></button>
    </main>
  </body>
</html>
