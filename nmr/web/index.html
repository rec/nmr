<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="referrer" content="no-referrer" />
    <meta name="description" content="Type a detail. Find its word name. Hear it." />
    <title>nmr</title>
    <link rel="stylesheet" href="style.css" />
    <script type="module" src="app.js"></script>
  </head>
  <body>
    <main>
      <h1>nmr</h1>
      <label class="visually-hidden" for="value">A detail or word name</label>
      <input id="value" type="text" autocomplete="off" autocapitalize="off"
        spellcheck="false" aria-describedby="status" autofocus />
      <button id="name" type="button" hidden aria-label="Play this name"></button>
      <p id="status" role="status" aria-live="polite">Loading…</p>
    </main>
  </body>
</html>
