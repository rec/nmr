<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="referrer" content="no-referrer" />
    <meta name="description" content="Type a detail. Find its truename. Hear it." />
    <title>nmr</title>
    <base href="./" />
    <link rel="stylesheet" href="style.css" />
    <link rel="stylesheet" href="clock.css" />
    <script type="module" src="app.js"></script>
  </head>
  <body>
    <header id="volume-controls">
      <button id="volume-toggle" type="button" popovertarget="volume-panel" aria-label="Volume" title="Volume">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M11 4 6 8H3v8h3l5 4V4ZM15 8a6 6 0 0 1 0 8m3-11a10 10 0 0 1 0 14" />
        </svg>
      </button>
      <div id="volume-panel" popover>
        <label for="volume-level">Volume</label>
        <input id="volume-level" type="range" min="0" max="110" step="1" value="100" autofocus />
        <output id="volume-value" for="volume-level">100 (-10 dB)</output>
      </div>
    </header>
    <main id="main-view" hidden>
      <h1 tabindex="-1">nmr</h1>
      <h2>true names of canonical things</h2>
      <button id="swap" type="button" aria-label="Swap description and true name" title="Swap description and true name">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M4 7h16m-4-4 4 4-4 4M20 17H4m4-4-4 4 4 4" />
        </svg>
      </button>
      <div class="panes">
        <section class="pane" aria-labelledby="source-heading">
          <h3 id="source-heading">description</h3>
          <input id="value" aria-labelledby="source-heading" type="text" autocomplete="off"
            autocapitalize="off" spellcheck="false" autofocus />
          <div id="name-editor" role="textbox" tabindex="0" aria-labelledby="source-heading" aria-autocomplete="inline" hidden><span id="typed"></span><span class="name-caret" aria-hidden="true"></span><span id="guessed"></span></div>
        </section>
        <section id="result-pane" class="pane" aria-labelledby="target-heading" aria-live="polite">
          <h3 id="target-heading">true name</h3>
          <button id="truename" class="truename" type="button" hidden aria-label="Play or stop the full-truename tune" aria-pressed="false"></button>
        </section>
      </div>
      <button id="copy-link" type="button" aria-live="polite">Copy link</button>
      <footer><a id="clock-link" href="?type=clock">Clock</a> · <a id="count-link" href="?count=0&amp;inc=1">Count</a></footer>
    </main>
    <main id="clock-view" class="clock" hidden>
      <h1 tabindex="-1">Clock</h1>
      <time id="clock-time" aria-label="Date and time"><span id="clock-date"></span><span id="clock-hours">00:00:00</span></time>
      <p id="clock-truename">Loading truename…</p>
      <div class="clock-controls">
        <div class="clock-play">
          <label><input id="clock-on" type="checkbox" /> Playing</label>
          <p id="clock-playing"></p>
        </div>
        <label><input id="clock-time-only" type="checkbox" /> Time only</label>
        <label><input id="clock-short-name" type="checkbox" /> Short name</label>
        <label><input id="clock-display-utc" type="checkbox" /> Display UTC</label>
        <select id="clock-interval" aria-label="Playback interval">
          <option value="5" selected>5 seconds</option>
          <option value="10">10 seconds</option>
          <option value="60">1 minute</option>
          <option value="3600">60 minutes</option>
        </select>
      </div>
      <footer><a id="main-link" href="?desc=">nmr</a> · <a id="clock-count-link" href="?count=0&amp;inc=1">Count</a></footer>
    </main>
    <main id="count-view" hidden>
      <h1 tabindex="-1">Count</h1>
      <label for="count-value">Count</label>
      <input id="count-value" type="text" inputmode="numeric" pattern="[0-9]+" value="0" autocomplete="off" spellcheck="false" />
      <div class="count-results">
        <section class="pane" aria-labelledby="count-name-heading">
          <h3 id="count-name-heading">true name</h3>
          <button id="count-truename" class="truename" type="button" hidden aria-label="Play the count's tune" aria-pressed="false"></button>
        </section>
        <section class="pane" aria-labelledby="count-object-heading">
          <h3 id="count-object-heading">description</h3>
          <p id="count-object" aria-live="polite"></p>
        </section>
      </div>
      <p id="count-message" role="status"></p>
      <div class="count-controls">
        <label><input id="count-run" type="checkbox" disabled /> Run</label>
        <label for="count-increment">Increment</label>
        <input id="count-increment" type="text" inputmode="numeric" pattern="[0-9]+" value="1" autocomplete="off" spellcheck="false" />
      </div>
      <footer><a id="count-main-link" href="?desc=">nmr</a> · <a id="count-clock-link" href="?type=clock">Clock</a></footer>
    </main>
  </body>
</html>
