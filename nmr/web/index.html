<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="referrer" content="no-referrer" />
    <meta name="description" content="Type a detail. Find its truename. Hear it." />
    <title>nmr</title>
    <base href="./" />
    <link rel="preload" as="image" href="world-map.svg" />
    <link rel="stylesheet" href="style.css" />
    <script src="vexflow.js"></script>
    <script type="module" src="app.js"></script>
  </head>
  <body>
    <header id="settings-controls">
      <button id="settings-toggle" type="button" popovertarget="settings-panel" aria-label="Settings" title="Settings">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="m9.5 3-.5 2a8 8 0 0 0-1.5.9l-2-.6L3 9.6 4.5 11a8 8 0 0 0 0 2L3 14.4l2.5 4.3 2-.6A8 8 0 0 0 9 19l.5 2h5l.5-2a8 8 0 0 0 1.5-.9l2 .6 2.5-4.3-1.5-1.4a8 8 0 0 0 0-2L21 9.6l-2.5-4.3-2 .6A8 8 0 0 0 15 5l-.5-2Z" />
          <circle cx="12" cy="12" r="3" />
        </svg>
      </button>
      <button id="help-toggle" type="button" popovertarget="help-panel" aria-label="Help" title="Help">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <circle cx="12" cy="12" r="9" />
          <path d="M9.5 8.5a2.5 2.5 0 0 1 5 0c0 2-2.5 2-2.5 4" />
          <path d="M12 16.5h.01" />
        </svg>
      </button>
      <section id="help-panel" popover aria-label="Help">Loading help…</section>
      <div id="settings-panel" popover aria-label="Settings">
        <h2>Settings</h2>
        <label class="settings-row">Keep last played music <input id="retain-playback" type="checkbox" checked /></label>
        <label class="settings-row">Time only <input id="clock-time-only" type="checkbox" /></label>
        <label class="settings-row">Display UTC <input id="clock-display-utc" type="checkbox" /></label>
        <label class="settings-row">Clock interval <select id="clock-interval">
          <option value="5">5 seconds</option><option value="10">10 seconds</option>
          <option value="60">1 minute</option><option value="3600">60 minutes</option>
        </select></label>
        <label class="settings-row">Playing note color <input id="score-highlight-color" type="color" value="#008000" /></label>
        <div class="settings-row">
          <label for="count-increment">Increment</label>
          <input id="count-increment" type="text" inputmode="numeric" pattern="[0-9]+" value="1" autocomplete="off" spellcheck="false" />
        </div>
        <label for="volume-level">Volume</label>
        <div class="volume-slider">
          <input id="volume-level" type="range" min="0" max="120" step="1" value="100" autofocus />
          <span class="volume-reference" title="100" aria-hidden="true"></span>
        </div>
        <output id="volume-value" for="volume-level">100</output>
        <div class="settings-row">
          <label for="score-top">Time signature</label>
          <div class="time-signature">
            <input id="score-top" type="text" inputmode="numeric" pattern="[0-9]*[1-9][0-9]*" value="4" aria-label="Time signature numerator" />
            <span>/</span>
            <select id="score-bottom" aria-label="Time signature denominator">
              <option>1</option><option>2</option><option>3</option><option selected>4</option>
              <option>6</option><option>8</option><option>12</option><option>16</option>
              <option>24</option><option>32</option><option>48</option><option>64</option>
            </select>
          </div>
        </div>
        <div id="tune-controls" role="group" aria-label="Tune rendering">
          <label class="settings-row">Root
            <select id="tune-root">
              <option value="48">C</option><option value="49">C#</option>
              <option value="50">D</option><option value="51">D#</option>
              <option value="52">E</option><option value="53" selected>F</option>
              <option value="54">F#</option><option value="55">G</option>
              <option value="56">G#</option><option value="57">A</option>
              <option value="58">A#</option><option value="59">B</option>
            </select>
          </label>
          <label class="settings-row">Position
            <select id="tune-position">
              <option value="start">start</option>
              <option value="middle" selected>middle</option>
              <option value="end">end</option>
            </select>
          </label>
        </div>
      </div>
    </header>
    <main id="workspace" data-mode="name">
      <h1>nmr</h1>
      <div class="mode-row">
        <fieldset id="modes"><legend>Mode</legend>
          <label><input type="radio" name="mode" value="name" checked /> Name</label>
          <label><input type="radio" name="mode" value="count" /> Count</label>
          <label><input type="radio" name="mode" value="clock" /> Clock</label>
        </fieldset>
        <label>Type <select id="type" aria-label="Type"><option value="">All types</option></select></label>
      </div>
      <section id="source-region" aria-label="Current source">
        <div id="name-editor" role="textbox" tabindex="0" aria-label="True name" aria-autocomplete="inline"><span id="typed"></span><span class="name-caret" aria-hidden="true"></span><span id="guessed"></span></div>
        <input id="count-value" aria-label="Count" type="text" inputmode="numeric" pattern="[0-9]+" value="0" autocomplete="off" spellcheck="false" hidden />
        <time id="clock-time" hidden></time>
      </section>
      <section id="description-region"><label for="value">Description</label>
        <input id="value" type="text" autocomplete="off" autocapitalize="off" spellcheck="false" />
      </section>
      <p id="current-name" aria-label="Current true name"></p>
      <section id="value-display" aria-label="Current object"></section>
      <div id="playback-controls">
        <button id="play" type="button" disabled>Play</button>
        <label><input id="automatic" type="checkbox" disabled /> Automatic</label>
        <button id="copy-link" type="button">Copy link</button>
      </div>
      <p id="message" role="status"></p>
      <section id="playback-area" aria-label="Playing music">
        <h3>Playing</h3>
        <p id="playing-name" aria-live="polite"></p>
        <div id="playing-score" aria-label="Playing music notation"></div>
      </section>
    </main>
  </body>
</html>
