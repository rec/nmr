<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="referrer" content="no-referrer" />
    <meta name="description" content="Type a detail. Find its truename. Hear it." />
    <title>nmr</title>
    <link rel="stylesheet" href="style.css" />
    <script type="module" src="app.js"></script>
  </head>
  <body>
    <main>
      <h1>nmr</h1>
      <h2>true names of canonical things</h2>
      <div class="panes">
        <section class="pane" aria-labelledby="source-heading">
          <h3 id="source-heading">Description</h3>
          <input id="value" aria-labelledby="source-heading" type="text" autocomplete="off"
            autocapitalize="off" spellcheck="false" autofocus />
        </section>
        <button id="swap" type="button" aria-label="Swap Description and True Name">Swap</button>
        <section class="pane" aria-labelledby="target-heading" aria-live="polite">
          <h3 id="target-heading">True Name</h3>
          <button id="truename" class="truename" type="button" hidden aria-label="Play or stop the prefix-relative tune" aria-pressed="false"></button>
          <button id="full-truename" class="truename" type="button" hidden aria-label="Play or stop the full-truename tune" aria-pressed="false"></button>
        </section>
      </div>
    </main>
  </body>
</html>
